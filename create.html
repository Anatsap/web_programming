<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create a New Car</title>
</head>
<body>
  <header>
    <a href="index.html">← Back to All Cars</a>
  </header>

  <main>
    <h1>Create a New Car</h1>
    <form id="new-car-form">
      <input id="brand-input" type="text" placeholder="Brand" required />
      <input id="power-input" type="number" min="0" placeholder="Engine power (hp)" required />
      <input id="speed-input" type="number" min="0" placeholder="Max speed (km/h)" required />
      <input id="img-input" type="text" placeholder="Image URL" required />
      <input id="type-input" type="text" placeholder="Type (sedan, sport...)" required />
      <input id="price-input" type="number" min="0" placeholder="Price" required />
      <button type="submit">Create Car</button>
    </form>
  </main>

  <script src="create.js"></script>
</body>
</html>
