<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First amazing live coding website </title>

    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;700&display=swap"
    rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">

</head>

<body>
    <section class="hero">
        <div class="container">
            <header class="header">
                <figure class="header__logo">
                    <img src="images/logo.svg" alt="Ellipse illustration">
                </figure> 
                <nav class="header__nav">
                    <img src="" alt="">
                    <ul>
                        <li class="header__title"><a href="">Home</a></li>
                        <li class="header__nav-item"><a href="">Find a doctor</a></li>
                        <li class="header__nav-item"><a href="">Apps</a></li>
                        <li class="header__nav-item"><a href="">Testimonials</a></li>
                        <li class="header__nav-item"><a href="">About us</a></li>
                    </ul>
                    
                </nav>
                <figure class="header__circles">
                    <img src="images/header_circle.svg" alt="Circles">
                </figure> 
            </header>
        </div>
        <div class="container">
            <div class="hero__inner">
                <article class="hero__text">
                    <h1 class="hero__title">Virtual healthcare for you</h1>
                    <p class="hero__paragraph">
                        Trafalgar provides progressive, and affordable 
                        healthcare, accessible on mobile and online 
                        for everyone
                    </p>
                    <div class="hero__button">
                        <button class="default-button">Consult today</button>
                    </div>
                </article>
            </div>
        </div>
    </section>
</body>

</html>
