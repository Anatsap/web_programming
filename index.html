<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Car</title>
</head>

<body class="bg-purple-950 text-white">
    <header>
        <nav class="nav-bar">
            <div class="container">
                <div class="links">
                    <a href="" class="btn">All cars</a>
                    <a href="" class="btn">My Cars</a>
                    <a href="create.html" class="btn">Create car</a>
                </div>
                <div class="search-wrapper">
                    <input type="text" id="search" placeholder="Type something..." />
                    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"></svg>
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
                        <path d="M21 21l-6 -6" />
                    </svg>
                </div>
                <button id="cartButton" class="cart-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" stroke-width="2"
                        stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path
                            d="M6.331 8h11.339a2 2 0 0 1 1.977 2.304l-1.255 8.152a3 3 0 0 1 -2.966 2.544h-6.852a3 3 0 0 1 -2.965 -2.544l-1.255 -8.152a2 2 0 0 1 1.977 -2.304z" />
                        <path d="M9 11v-5a3 3 0 0 1 6 0v5" />
                    </svg>
                    <small id="cartCount">0</small>
                </button>
            </div>
        </nav>
    </header>

    <main class="main-content">
        <div class="sort-wrapper">
        <label for="sort">Sort by:</label>
            <select id="sort">
            <option value="">-- Choose --</option>
            <option value="high">Price: High → Low</option>
            <option value="low">Price: Low → High</option>
            </select>
            <button id="calculatePriceBtn">Calculate Total Price</button>
            <div id="totalPrice"></div>
        </div>
        <aside class="sidebar">
            <h2>Filters</h2>
            <h3>Category</h3>
            <ul id="filters-container">
                <li><input type="checkbox" id="sport" /><label for="sport">Sports car</label></li>
                <li><input type="checkbox" id="sedan" /><label for="sedan">Sedans</label></li>
                <li><input type="checkbox" id="minivan" /><label for="minivan">Minivan</label></li>
                <li><input type="checkbox" id="SUV" /><label for="SUV">SUV</label></li>
                <li><input type="checkbox" id="truck" /><label for="truck">Truck</label></li>
                <li><input type="checkbox" id="coupe" /><label for="coupe">Coupe</label></li>
            </ul>
        </aside>
        <section id="products-wrapper"></section>
    
    </main>
    <script type="module" src="script.js"></script>
</body>

</html>
